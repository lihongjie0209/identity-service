# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: true
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
database:
  enabled: true
  name: platform
  schema: identity
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/auth/logout
    - /api/v1/auth/sessions/revoke
    - /api/v1/sessions/revoke
    - /api/v1/identities/update-status
    - /api/v1/identities/mfa/reset
    - /api/v1/service-accounts/update-status
  grpc_methods:
    - /platform.identity.v1.IdentityService/RevokeTenantSessions
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
mfa:
  enabled: true
outbound:
  grpc:
    authorization:
      target: authorization-service.platform.svc.cluster.local:9090
      tls: {enabled: true, server_name: authorization-service.platform.svc.cluster.local, ca_file: /etc/platform/tls/ca.crt, cert_file: /etc/platform/tls/tls.crt, key_file: /etc/platform/tls/tls.key}
