basePath: /
definitions:
  buildinfo.Info:
    properties:
      build_time:
        type: string
      commit:
        type: string
      started_at:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.Dependency:
    properties:
      latency:
        type: string
      status:
        type: string
    type: object
  health.Status:
    properties:
      dependencies:
        additionalProperties:
          $ref: '#/definitions/health.Dependency'
        type: object
      status:
        type: string
    type: object
  httptransport.CreateServiceAccountRequest:
    properties:
      audiences:
        items:
          type: string
        type: array
      name:
        type: string
    required:
    - audiences
    - name
    type: object
  httptransport.IdentityResponseBody:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      phone:
        type: string
      status:
        type: string
      username:
        type: string
      version:
        type: integer
    type: object
  httptransport.ListIdentitiesRequest:
    properties:
      keyword:
        type: string
      page:
        type: integer
      page_size:
        type: integer
      status:
        type: string
    type: object
  httptransport.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    required:
    - login
    - password
    type: object
  httptransport.LogoutRequest:
    properties:
      reason:
        type: string
      session_id:
        type: string
    required:
    - session_id
    type: object
  httptransport.MeResponseBody:
    properties:
      subject:
        type: string
    type: object
  httptransport.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  httptransport.RegisterIdentityRequest:
    properties:
      display_name:
        type: string
      email:
        type: string
      password:
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - display_name
    - email
    - password
    - username
    type: object
  httptransport.Response:
    properties:
      body: {}
      code:
        type: integer
      message:
        type: string
      request_id:
        type: string
    type: object
  httptransport.ServiceAccountTokenRequest:
    properties:
      client_id:
        type: string
      client_secret:
        type: string
    required:
    - client_id
    - client_secret
    type: object
  httptransport.UpdateIdentityStatusRequest:
    properties:
      id:
        type: string
      reason:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - id
    - status
    - version
    type: object
  httptransport.UpdateServiceAccountStatusRequest:
    properties:
      id:
        type: string
      status:
        type: string
      version:
        type: integer
    required:
    - id
    - status
    - version
    type: object
  identity.JWK:
    properties:
      alg:
        type: string
      crv:
        type: string
      kid:
        type: string
      kty:
        type: string
      use:
        type: string
      x:
        type: string
    type: object
  identity.JWKS:
    properties:
      keys:
        items:
          $ref: '#/definitions/identity.JWK'
        type: array
    type: object
  identity.Tokens:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      session_id:
        type: string
      token_type:
        type: string
    type: object
info:
  contact: {}
  description: 'Production-oriented Go Web API scaffold. Application error codes:
    0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business; 50000-59999 infrastructure.'
  title: Go API Template
  version: "1.0"
paths:
  /.well-known/jwks.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/identity.JWKS'
      summary: Return active and grace-period verification keys
      tags:
      - authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Username/email and password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/identity.Tokens'
              type: object
        "400":
          description: 'Code 10001: invalid request'
          schema:
            $ref: '#/definitions/httptransport.Response'
        "401":
          description: 'Code 20001: invalid credentials'
          schema:
            $ref: '#/definitions/httptransport.Response'
        "429":
          description: 'Code 10029: rate limited'
          schema:
            $ref: '#/definitions/httptransport.Response'
      summary: Issue a JWT access token
      tags:
      - authentication
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Session
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Revoke the current session
      tags:
      - authentication
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/identity.Tokens'
              type: object
      summary: Rotate a refresh token
      tags:
      - authentication
  /api/v1/auth/service-token:
    post:
      consumes:
      - application/json
      parameters:
      - description: Client credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ServiceAccountTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      summary: Issue a service-account access token
      tags:
      - authentication
  /api/v1/identities/list:
    post:
      consumes:
      - application/json
      parameters:
      - description: Filters and pagination
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.ListIdentitiesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: List user identities
      tags:
      - identities
  /api/v1/identities/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Identity
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.RegisterIdentityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.IdentityResponseBody'
              type: object
      security:
      - Bearer: []
      - PSK: []
      summary: Register a user identity
      tags:
      - identities
  /api/v1/identities/update-status:
    post:
      consumes:
      - application/json
      parameters:
      - description: Status and version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateIdentityStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.IdentityResponseBody'
              type: object
      security:
      - Bearer: []
      summary: Update user status with optimistic locking
      tags:
      - identities
  /api/v1/me:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MeResponseBody'
              type: object
        "401":
          description: 'Code 20001: unauthorized'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Return the authenticated subject
      tags:
      - authentication
  /api/v1/service-accounts/create:
    post:
      consumes:
      - application/json
      parameters:
      - description: Service account
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.CreateServiceAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Create a service account and return its secret once
      tags:
      - service-accounts
  /api/v1/service-accounts/update-status:
    post:
      consumes:
      - application/json
      parameters:
      - description: Status and version
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httptransport.UpdateServiceAccountStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Enable or disable a service account with optimistic locking
      tags:
      - service-accounts
  /api/v1/version:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/buildinfo.Info'
              type: object
      summary: Return build and runtime version information
      tags:
      - operations
  /live:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check process liveness
      tags:
      - operations
  /ready:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
        "503":
          description: 'Code 50003: dependency unavailable'
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/health.Status'
              type: object
      summary: Check database and Redis readiness
      tags:
      - operations
schemes:
- http
- https
securityDefinitions:
  Bearer:
    description: Enter "Bearer {JWT}".
    in: header
    name: Authorization
    type: apiKey
  PSK:
    description: Enter "PSK {shared-key}" for routes configured with PSK authentication.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
